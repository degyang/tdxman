[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdxman"
version = "1.1.3"
description = "通达信 TCP 协议行情数据客户端，支持在线行情与离线本地数据读取"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "tzdata>=2024.1", "click>=8.0", "duckdb>=1.1", "pyarrow>=17", "baostock>=0.9.4,<0.10"]

[project.scripts]
tdxman = "tdxman.cli:cli"  # cli/__init__.py exposes the click group
aspool = "aspool.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "mypy>=1.9", "ruff>=0.4"]
tick-stock-panel = [
    "polars>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tdxman", "src/aspool"]

[tool.hatch.build.targets.wheel.force-include]
"settings/ex_assets.json" = "aspool/resources/ex_assets.json"

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
